
<!DOCTYPE html>
<!-- wikitiki modern v1.1.0 · clean production build -->

<html>
<head>
<meta charset="utf-8"/>
<title>wikitiki</title>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<style>
:root{
  --tileSize:clamp(90px,25vw,150px);
  --ratio:1/1;
  --chromeH:31px;
}

html,body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  height:100%;
  overflow:hidden;
}

/* =========================================================
   HEADER
   ========================================================= */

.ui{
  position:fixed;
  top:0; left:0; right:0;
  height:var(--chromeH);
  box-sizing:border-box;
  z-index:10;
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px 8px 5px;
  overflow:hidden;
  white-space:nowrap;
  background:#eee;
  color:#111;
  border-bottom:1px solid #999;
  font-family:Arial,Helvetica,sans-serif;
  font-size:12px;
  line-height:1;
}

.brand{
  display:inline-flex;
  align-items:baseline;
  gap:6px;
  flex:0 0 auto;
}

.titleWrap{display:inline;}
.title{
  display:inline;
  font-family:Arial,Helvetica,sans-serif;
  font-size:13px;
  font-weight:bold;
  color:#0000ee;
  text-decoration:underline;
}

.subtitle{
  display:inline;
  margin-left:6px;
  font-size:11px;
  color:#555;
  letter-spacing:0;
  text-transform:none;
}

.statusLight{
  width:7px;
  height:7px;
  display:inline-block;
  border-radius:50%;
  background:#169b28;
  border:1px solid #0b5c16;
  transform:translateY(-1px);
}

body.is-stopped .statusLight{
  background:#a00;
  border-color:#600;
}

body.is-reconnecting:not(.is-stopped) .statusLight{
  background:#c58b00;
  border-color:#7a5400;
}

.controlGroup{
  display:inline-flex;
  align-items:center;
  gap:0;
  height:auto;
  padding:0;
  margin:0;
  border:0;
  background:transparent;
  box-shadow:none;
  flex:0 0 auto;
}

.controlGroup:before{
  content:"|";
  color:#777;
  margin:0 7px 0 1px;
}

.controlGroup.mainActions{
  margin-left:auto;
}

button{
  appearance:none;
  -webkit-appearance:none;
  border:0;
  background:transparent;
  padding:0 3px;
  margin:0;
  height:auto;
  min-width:0;
  display:inline;
  color:#0000ee;
  font:inherit;
  font-size:12px;
  text-decoration:underline;
  cursor:pointer;
  border-radius:0;
  box-shadow:none;
  text-shadow:none;
  text-transform:none;
  letter-spacing:0;
}

button:hover{background:#ddd;}
button:active{color:#551a8b;}
button + button:before{
  content:"/";
  color:#777;
  display:inline-block;
  margin:0 5px 0 2px;
  text-decoration:none;
}

button.active,
button.running,
button.modeOn{
  color:#000;
  font-weight:bold;
  text-decoration:none;
  cursor:default;
}

button.stopped{
  color:#777;
  text-decoration:none;
}

.keyHint{
  display:none;
}

@media (max-width:620px){
  :root{--chromeH:55px;}
  .ui{
    height:var(--chromeH);
    flex-wrap:wrap;
    align-content:flex-start;
    gap:5px;
    padding:6px 7px;
    line-height:1.2;
  }
  .controlGroup.mainActions{margin-left:0;}
  .brand{width:100%;}
  .subtitle{font-size:10px;}
}

:fullscreen .ui{display:none;}
:fullscreen .grid{top:0;}

/* GRID */

.grid{
  position:fixed;
  top:var(--chromeH);
  left:0;right:0;bottom:0;
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(var(--tileSize),1fr));
  gap:1px;
  overflow:hidden;
}

.grid.avatar{--ratio:1/1;}
.grid.avatar .tile{border-radius:50%;}

.tile{
  aspect-ratio:var(--ratio);
  background-size:cover;
  background-position:center;
  background-color:#111;
  opacity:0;
  transition:.3s;
  cursor:pointer;
  position:relative;
}

.tile.show{opacity:1;}
.placeholder{background:#1a1a1a!important;}

.info{
  position:absolute;
  inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.8),transparent);
  font-size:10px;
  padding:5px;
  display:flex;
  align-items:flex-end;
  opacity:0;
}

.tile:hover .info{opacity:1;}
@media (hover:none){.info{opacity:.6;}}
</style>
</head>
<body>
<div class="ui">
  <div class="brand">
    <span class="statusLight" aria-hidden="true"></span>
    <div class="titleWrap"><div class="title">wikitiki</div><div class="subtitle">wikipedia image stream</div></div>
  </div>

  <div class="controlGroup ratioGroup" aria-label="Image format">
    <button class="ratioBtn active" data-ratio="square">grid</button>
    <button class="ratioBtn" data-ratio="avatar">circle</button>
  </div>

  <div class="controlGroup utilityGroup" aria-label="View tools">
    <button id="downloadBtn" onclick="toggleDownloadMode()">save</button>
    <button onclick="toggleFullscreen()">full</button>
  </div>

  <div class="controlGroup mainActions" aria-label="Stream controls">
    <button id="startBtn" onclick="start()">start</button>
    <button class="stopped" id="stopBtn" onclick="stop()">stop</button>
  </div>
</div>
<div class="grid" id="grid"></div>
<script>
"use strict";

const BUILD_VERSION="1.1.0";
const STREAM_URL="https://stream.wikimedia.org/v2/stream/recentchange";
const MAX_PENDING_REQUESTS=24;
const RECENT_PAGE_LIMIT=400;
const RECENT_IMAGE_LIMIT=400;

const BLOCKED_WIKIS=new Set([
  "cewiki"
]);

const BLOCKED_DOMAINS=new Set([
  "ce.wikipedia.org"
]);

const grid=document.getElementById("grid");
const startBtn=document.getElementById("startBtn");
const stopBtn=document.getElementById("stopBtn");
const downloadBtn=document.getElementById("downloadBtn");

let source=null;
let currentMode="square";
let downloadMode=false;
let pendingRequests=0;

const recentPages=new Set();
const recentImages=new Set();

function rememberBounded(set,key,limit){
  if(set.has(key)) return false;
  set.add(key);

  while(set.size>limit){
    set.delete(set.values().next().value);
  }

  return true;
}

function getEventDomain(edit){
  const direct=String(
    edit?.server_name||
    edit?.domain||
    edit?.meta?.domain||
    ""
  ).trim().toLowerCase();

  if(direct) return direct;

  const wiki=String(edit?.wiki||edit?.database||"").trim().toLowerCase();
  const match=wiki.match(/^([a-z0-9_-]+)wiki$/);
  return match ? `${match[1].replaceAll("_","-")}.wikipedia.org` : "";
}

function isBlockedChange(edit){
  const wiki=String(edit?.wiki||edit?.database||"").toLowerCase();
  const domain=getEventDomain(edit);

  return BLOCKED_WIKIS.has(wiki) ||
         BLOCKED_DOMAINS.has(domain);
}

function getWikipediaContext(edit){
  if(isBlockedChange(edit)) return null;

  const domain=getEventDomain(edit);
  if(!domain.endsWith(".wikipedia.org")) return null;

  return {
    domain,
    articleBase:`https://${domain}/wiki/`,
    summaryBase:`https://${domain}/api/rest_v1/page/summary/`
  };
}

function toggleFullscreen(){
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(error=>{
      console.debug("[wikitiki] fullscreen unavailable",error);
    });
  }else{
    document.exitFullscreen().catch(error=>{
      console.debug("[wikitiki] fullscreen exit failed",error);
    });
  }
}

document.querySelectorAll(".ratioBtn").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".ratioBtn").forEach(item=>{
      item.classList.remove("active");
    });

    btn.classList.add("active");
    currentMode=btn.dataset.ratio;
    grid.className=currentMode==="square" ? "grid" : `grid ${currentMode}`;

    trimRealTiles();
    ensurePlaceholders();
  });
});

function getRatio(){
  if(currentMode==="avatar") return 1;

  const raw=getComputedStyle(grid).getPropertyValue("--ratio").trim();
  const [width,height]=raw.split("/").map(Number);
  const ratio=width/height;

  return Number.isFinite(ratio) && ratio>0 ? ratio : 1;
}

function cleanFilename(value){
  const cleaned=String(value||"image")
    .replace(/[\\/:*?"<>|]/g,"_")
    .replace(/\s+/g," ")
    .trim();

  return cleaned||"image";
}

function triggerBlobDownload(blob,filename){
  const objectUrl=URL.createObjectURL(blob);
  const link=document.createElement("a");

  link.href=objectUrl;
  link.download=filename;
  document.body.appendChild(link);
  link.click();
  link.remove();

  setTimeout(()=>URL.revokeObjectURL(objectUrl),1000);
}

function cropDownload(url,title){
  const image=new Image();
  image.crossOrigin="anonymous";
  image.decoding="async";

  image.onload=()=>{
    try{
      const ratio=getRatio();
      const sourceWidth=image.naturalWidth||image.width;
      const sourceHeight=image.naturalHeight||image.height;

      let cropWidth=sourceWidth;
      let cropHeight=cropWidth/ratio;

      if(cropHeight>sourceHeight){
        cropHeight=sourceHeight;
        cropWidth=cropHeight*ratio;
      }

      const sourceX=(sourceWidth-cropWidth)/2;
      const sourceY=(sourceHeight-cropHeight)/2;
      const outputWidth=1024;
      const outputHeight=Math.round(outputWidth/ratio);

      const canvas=document.createElement("canvas");
      canvas.width=outputWidth;
      canvas.height=outputHeight;

      const context=canvas.getContext("2d");
      if(!context) throw new Error("Canvas context unavailable.");

      if(currentMode==="avatar"){
        context.beginPath();
        context.arc(
          outputWidth/2,
          outputHeight/2,
          Math.min(outputWidth,outputHeight)/2,
          0,
          Math.PI*2
        );
        context.clip();
      }

      context.drawImage(
        image,
        sourceX,
        sourceY,
        cropWidth,
        cropHeight,
        0,
        0,
        outputWidth,
        outputHeight
      );

      const isAvatar=currentMode==="avatar";
      const mimeType=isAvatar ? "image/png" : "image/jpeg";
      const extension=isAvatar ? "png" : "jpg";
      const quality=isAvatar ? undefined : 0.92;

      canvas.toBlob(blob=>{
        if(!blob){
          console.debug("[wikitiki] image export produced no data");
          return;
        }

        triggerBlobDownload(
          blob,
          `${cleanFilename(title)}.${extension}`
        );
      },mimeType,quality);
    }catch(error){
      console.debug("[wikitiki] image export failed",error);
    }
  };

  image.onerror=()=>{
    console.debug("[wikitiki] image download failed",url);
  };

  image.src=url;
}

function updateStreamUi(running){
  document.body.classList.toggle("is-stopped",!running);
  if(!running) document.body.classList.remove("is-reconnecting");

  startBtn.classList.toggle("running",running);
  stopBtn.classList.toggle("stopped",!running);
}

function start(){
  if(source) return;

  source=new EventSource(STREAM_URL);

  source.onopen=()=>{
    document.body.classList.remove("is-reconnecting");
  };

  source.onerror=()=>{
    if(source) document.body.classList.add("is-reconnecting");
  };

  source.onmessage=event=>{
    try{
      const edit=JSON.parse(event.data);

      if(isBlockedChange(edit)) return;
      if(edit.type!=="edit" || edit.namespace!==0) return;

      queueTile(edit);
    }catch(error){
      console.debug("[wikitiki] invalid stream event",error);
    }
  };

  updateStreamUi(true);
}

function stop(){
  if(source){
    source.close();
    source=null;
  }

  updateStreamUi(false);
}

function getGridCapacity(){
  const styles=getComputedStyle(grid);
  const columnGap=parseFloat(styles.columnGap)||0;
  const rowGap=parseFloat(styles.rowGap)||0;
  const template=styles.gridTemplateColumns.trim();

  let columns=0;

  if(template && template!=="none"){
    columns=template.split(/\s+/).filter(Boolean).length;
  }

  if(!columns){
    const tileSize=parseFloat(
      getComputedStyle(document.documentElement)
        .getPropertyValue("--tileSize")
    )||150;

    columns=Math.max(
      1,
      Math.floor((grid.clientWidth+columnGap)/(tileSize+columnGap))
    );
  }

  const tileWidth=Math.max(
    1,
    (grid.clientWidth-columnGap*(columns-1))/columns
  );

  const tileHeight=tileWidth/getRatio();
  const rows=Math.max(
    1,
    Math.ceil((grid.clientHeight+rowGap)/(tileHeight+rowGap))
  );

  return columns*rows;
}

function getRealTiles(){
  return [...grid.children].filter(tile=>{
    return !tile.classList.contains("placeholder");
  });
}

function getPlaceholders(){
  return [...grid.children].filter(tile=>{
    return tile.classList.contains("placeholder");
  });
}

function trimRealTiles(){
  const capacity=getGridCapacity();
  const realTiles=getRealTiles();

  realTiles.slice(capacity).forEach(tile=>tile.remove());
}

function ensurePlaceholders(){
  trimRealTiles();

  const capacity=getGridCapacity();
  const realCount=getRealTiles().length;
  const placeholders=getPlaceholders();
  const required=Math.max(0,capacity-realCount);

  if(placeholders.length<required){
    const fragment=document.createDocumentFragment();

    for(let index=placeholders.length;index<required;index++){
      const tile=document.createElement("div");
      tile.className="tile show placeholder";
      fragment.appendChild(tile);
    }

    grid.appendChild(fragment);
  }

  if(placeholders.length>required){
    placeholders
      .slice(required)
      .forEach(tile=>tile.remove());
  }
}

function waitForImage(url){
  return new Promise((resolve,reject)=>{
    const image=new Image();
    image.decoding="async";

    image.onload=()=>resolve(image);
    image.onerror=()=>reject(new Error(`Image failed: ${url}`));
    image.src=url;
  });
}

async function addTile(edit,context){
  const title=String(edit.title||"").trim();
  if(!title) return;

  const encodedTitle=encodeURIComponent(title);
  const articleUrl=context.articleBase+encodedTitle;
  const summaryUrl=context.summaryBase+encodedTitle;

  const response=await fetch(summaryUrl,{
    headers:{Accept:"application/json"}
  });

  if(!response.ok){
    throw new Error(`Summary request failed: ${response.status}`);
  }

  const summary=await response.json();
  const thumbnail=summary?.thumbnail?.source;

  if(!thumbnail) return;
  if(!rememberBounded(recentImages,thumbnail,RECENT_IMAGE_LIMIT)) return;

  const fullImage=summary?.originalimage?.source||thumbnail;
  await waitForImage(thumbnail);

  const tile=document.createElement("div");
  tile.className="tile";
  tile.style.backgroundImage=`url("${thumbnail.replaceAll('"','\\"')}")`;

  const info=document.createElement("div");
  info.className="info";
  info.textContent=title;
  tile.appendChild(info);

  tile.addEventListener("click",event=>{
    if(downloadMode || event.altKey){
      event.preventDefault();
      cropDownload(fullImage,title);
      return;
    }

    window.open(articleUrl,"_blank","noopener,noreferrer");
  });

  grid.prepend(tile);
  requestAnimationFrame(()=>tile.classList.add("show"));

  const placeholder=getPlaceholders()[0];
  if(placeholder) placeholder.remove();

  trimRealTiles();
  ensurePlaceholders();
}

function queueTile(edit){
  if(pendingRequests>=MAX_PENDING_REQUESTS) return;

  const context=getWikipediaContext(edit);
  if(!context) return;

  const pageKey=`${context.domain}:${edit.title}`;
  if(!rememberBounded(recentPages,pageKey,RECENT_PAGE_LIMIT)) return;

  pendingRequests++;

  addTile(edit,context)
    .catch(error=>{
      console.debug("[wikitiki] tile skipped",error);
    })
    .finally(()=>{
      pendingRequests--;
    });
}

function toggleDownloadMode(){
  downloadMode=!downloadMode;
  downloadBtn.classList.toggle("modeOn",downloadMode);
}

document.addEventListener("keydown",event=>{
  if(["INPUT","TEXTAREA"].includes(event.target.tagName)) return;

  if(event.code==="Space"){
    event.preventDefault();
    source ? stop() : start();
  }

  if(event.code==="KeyF"){
    toggleFullscreen();
  }

  if(event.code==="KeyR"){
    const buttons=[...document.querySelectorAll(".ratioBtn")];
    let index=buttons.findIndex(button=>button.classList.contains("active"));
    index=(index+1)%buttons.length;
    buttons[index].click();
  }

  if(event.code==="KeyD"){
    toggleDownloadMode();
  }
});

if("ResizeObserver" in window){
  new ResizeObserver(()=>{
    trimRealTiles();
    ensurePlaceholders();
  }).observe(grid);
}else{
  window.addEventListener("resize",()=>{
    trimRealTiles();
    ensurePlaceholders();
  });
}

ensurePlaceholders();
start();
</script>
</body>
</html>
